# SSR response cache zone
proxy_cache_path /var/cache/nginx/guiatv levels=1:2 keys_zone=guiatv_ssr:10m
                 max_size=100m inactive=10m use_temp_path=off;
proxy_cache_path /var/cache/nginx/guiatv_api levels=1:2 keys_zone=guiatv_api:20m
                 max_size=250m inactive=1h use_temp_path=off;

server {
  listen 80;
  server_name guiaprogramaciontv.com www.guiaprogramaciontv.com;

  location ^~ /.well-known/acme-challenge/ {
    root /var/www/letsencrypt;
    allow all;
  }

  location / {
    return 301 https://guiaprogramaciontv.com$request_uri;
  }
}

server {
  listen 443 ssl http2;
  server_name guiaprogramaciontv.com;

  client_max_body_size 20m;
  root /var/www/guiatv/current/apps/frontend/dist/guiatv/browser;

  ssl_certificate /etc/letsencrypt/live/guiaprogramaciontv.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/guiaprogramaciontv.com/privkey.pem;

  location ^~ /.well-known/acme-challenge/ {
    root /var/www/letsencrypt;
    allow all;
  }

  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 1d;

  # HSTS — tell browsers to always use HTTPS (1 year)
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

  location ^~ /v2/ws {
    proxy_pass http://127.0.0.1:4000;
    include /etc/nginx/snippets/guiatv_proxy.conf;
  }

  location /v2/ {
    proxy_pass http://127.0.0.1:4000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_http_version 1.1;
    proxy_connect_timeout 5s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;
    send_timeout 30s;
    proxy_buffering on;
    proxy_cache guiatv_api;
    proxy_cache_methods GET HEAD;
    proxy_cache_key $scheme$host$request_uri;
    proxy_cache_bypass $http_authorization $http_cookie;
    proxy_no_cache $http_authorization $http_cookie $upstream_http_set_cookie;
    proxy_cache_lock on;
    proxy_cache_lock_timeout 5s;
    proxy_cache_background_update on;
    proxy_cache_use_stale updating error timeout invalid_header http_500 http_502 http_503 http_504;
    add_header X-Cache-Status $upstream_cache_status always;
    # A location's own add_header drops the server-level ones (nginx 1.24 has no add_header_inherit): repeat HSTS.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  }

  location = /v2 {
    proxy_pass http://127.0.0.1:4000;
    include /etc/nginx/snippets/guiatv_proxy.conf;
  }

  location ^~ /storage {
    proxy_pass http://127.0.0.1:4000;
    include /etc/nginx/snippets/guiatv_proxy.conf;
  }

  location = /sitemap.xml {
    proxy_pass http://127.0.0.1:4000/sitemap.xml;
    include /etc/nginx/snippets/guiatv_proxy.conf;
  }

  location ~ ^/sitemap-[a-z]+\.xml$ {
    proxy_pass http://127.0.0.1:4000;
    include /etc/nginx/snippets/guiatv_proxy.conf;
  }

  location = /favicon.ico {
    try_files /favicon.ico =404;
    access_log off;
    expires 1h;
  }

  location = /robots.txt {
    try_files /robots.txt =404;
    access_log off;
    expires 1h;
  }

  location ^~ /assets/ {
    try_files $uri =404;
    access_log off;
    expires 1y;
    add_header Cache-Control "public, immutable";
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  }

  location ^~ /media/ {
    try_files $uri =404;
    access_log off;
    expires 1y;
    add_header Cache-Control "public, immutable";
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  }

  location ~* \.(?:js|mjs|css|map|png|jpe?g|gif|svg|webp|avif|woff2?|ttf)$ {
    try_files $uri =404;
    access_log off;
    expires 1y;
    add_header Cache-Control "public, immutable";
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  }

  # Strip trailing slashes (except root) — canonical URL normalization
  location ~ ^(.+)/$ {
    return 301 $1;
  }

  location / {
    proxy_pass http://127.0.0.1:3000;

    # Proxy headers (inline instead of snippet to enable buffering for cache)
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_http_version 1.1;
    proxy_connect_timeout 60s;
    proxy_send_timeout 120s;
    proxy_read_timeout 120s;
    send_timeout 120s;
    proxy_buffering on;

    # SSR response caching — bypass for authenticated users and noindex pages
    proxy_cache guiatv_ssr;
    proxy_cache_valid 200 5m;
    proxy_cache_key $scheme$host$request_uri;
    proxy_cache_bypass $cookie_session $http_authorization;
    proxy_no_cache $cookie_session $http_authorization;
    proxy_ignore_headers Vary Expires;
    # Respect Cache-Control from SSR (no-store on error fallbacks must pass through)
    add_header X-Cache-Status $upstream_cache_status;
    # M09-C: this location's add_header dropped the server-level HSTS from every HTML page.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # Pass X-Robots-Tag from upstream SSR to client (belt-and-suspenders for noindex)
    proxy_pass_header X-Robots-Tag;
  }
}

server {
  listen 443 ssl http2;
  server_name www.guiaprogramaciontv.com;

  ssl_certificate /etc/letsencrypt/live/guiaprogramaciontv.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/guiaprogramaciontv.com/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 1d;

  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

  return 301 https://guiaprogramaciontv.com$request_uri;
}
