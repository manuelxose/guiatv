name: SEO regression

on:
  # 2026-10-27: not on pull requests (owner: PRs must be fast). It runs after merge on main, path-filtered,
  # and on demand; a regression there is fixed forward or rolled back before the next deploy.
  # M10: also on main, so a regression that only appears after merge (e.g. dated fixtures) is visible there.
  # Never deploys; live-crawl stays manual through its `if`.
  push:
    branches: [main]
    paths:
      - 'apps/frontend/**'
      - 'apps/backend/src/**'
      - 'scripts/seo-*.mjs'
      - 'e2e/entity/**'
      - 'playwright.entity.config.ts'
      - '.github/workflows/seo-regression.yml'
  workflow_dispatch:
  # Weekly live crawl is intentionally NOT scheduled until the owner approves it:
  # schedule:
  #   - cron: '0 6 * * 1'

jobs:
  ssr-resilience:
    # API down => data routes must answer 503/no-store/noindex, never a cacheable 200 or a false 404.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: node --test apps/frontend/scripts/ssr-cache.test.mjs apps/frontend/scripts/ssr-canonical.test.mjs apps/frontend/scripts/entity-canary-verify.test.mjs
      - run: node scripts/seo-crawl.mjs --self-check && node scripts/seo-link-graph.mjs --self-check
      - run: npm run build:frontend
      - run: node --test apps/frontend/scripts/entity-read-ssr.test.mjs apps/frontend/scripts/legacy-enrichment-ssr.test.mjs
      - run: npm run seo:ssr-resilience
      # Phase 3D: the entity page in desktop and mobile Chromium against the real SSR bundle (fake API, no database).
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test -c playwright.entity.config.ts

  live-crawl:
    # Read-only audit of production; only on manual dispatch.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/seo-crawl.mjs --out seo-crawl.json
      - run: node scripts/editorial-audit.mjs --json editorial-audit.json
        continue-on-error: true # findings are review prompts; the crawl above is the hard gate
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: seo-reports
          path: |
            seo-crawl.json
            editorial-audit.json
