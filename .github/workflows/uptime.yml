name: External uptime probe

# Runs OFF the VPS. The in-host watchdog dies with the machine, so both 2026-10-20/21 outages went unseen
# until someone looked. This is public GETs only (home, API health, robots, sitemap, a hub page) and fails
# the run, which emails the repository's notification recipients, when the site does not answer.
# It never deploys, restarts, reboots or writes anything.
on:
  schedule:
    - cron: '*/15 * * * *' # GitHub may delay scheduled runs by several minutes under load
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: uptime-probe
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Probe production
        env:
          # Set to "canary" (repository variable) only while the owner has activated the entity canary.
          ENTITY_EXPECTATION: ${{ vars.ENTITY_EXPECTATION || 'off' }}
          UPTIME_WEBHOOK_URL: ${{ secrets.UPTIME_WEBHOOK_URL }}
        run: node scripts/uptime-probe.mjs --origin https://guiaprogramaciontv.com

  # Visibility that needs no webhook and no e-mail: one open issue while the site is failing, closed when it recovers.
  # The step summary of each run (above) carries the per-check table. This job only touches issues of this repository.
  report:
    needs: probe
    if: always() && needs.probe.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TITLE: 'Production uptime alert'
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Open, update or close the alert issue
        run: |
          open=$(gh issue list --state open --search "$TITLE in:title" --json number,title --jq "[.[] | select(.title == \"$TITLE\")][0].number // empty")
          if [ "${{ needs.probe.result }}" = "failure" ]; then
            if [ -n "$open" ]; then gh issue comment "$open" --body "Still failing: $RUN_URL"
            else gh issue create --title "$TITLE" --body "The external probe of https://guiaprogramaciontv.com failed: $RUN_URL. Runbook: docs/ops/VPS-RELIABILITY-RUNBOOK.md. This issue closes itself when the probe passes again."; fi
          elif [ -n "$open" ]; then
            gh issue close "$open" --comment "Recovered: $RUN_URL"
          fi
