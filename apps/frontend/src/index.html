<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>Guía de Programación TV — Qué ver hoy en televisión y streaming</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="google-adsense-account" content="ca-pub-9653385567378817" />
    
    <!-- SEO Meta Tags -->
    <meta
      name="description"
      content="Consulta nuestra completa guía de programación TV y descubre los horarios de tus programas, series y películas favoritas en todos los canales de televisión."
    />
    <meta
      name="keywords"
      content="guía TV, programación TV, horarios televisión, guía de programas, series, películas, canales de televisión, programación de canales, televisión en vivo"
    />
    <meta name="author" content="TecnoRia" />
    
    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="GuíaProgramaciónTV" />
    <meta property="og:title" content="Guía de Programación TV — Qué ver hoy en televisión y streaming" />
    <meta property="og:description" content="Consulta nuestra completa guía de programación TV y descubre los horarios de tus programas, series y películas favoritas en todos los canales de televisión." />
    <meta property="og:url" content="https://guiaprogramaciontv.com/" />
    <meta property="og:locale" content="es_ES" />
    <meta name="twitter:card" content="summary_large_image" />
    
    <!-- Favicon & App Icons -->
    <link rel="icon" type="image/svg+xml" href="assets/logo.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="assets/logo.svg" />
    <link rel="apple-touch-icon" href="assets/logo.svg" />
    <meta name="theme-color" content="#121212" />
    <meta name="msapplication-TileColor" content="#121212" />
    <meta property="og:image" content="https://guiaprogramaciontv.com/assets/og-image.jpg" />
    
    <!-- Theme bootstrap: apply persisted/system preference before first paint so
         there is no light/dark flash during SSR hydration. Mirrors ThemeService. -->
    <script>
      (function () {
        try {
          var mode = localStorage.getItem('guiatv-theme');
          var dark = mode === 'dark'
            || (mode !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>

    <!-- Consent bootstrap: hide the SSR consent banner before first paint for visitors who already chose.
         Must match parseConsentCookie() in services/analytics/consent.service.ts (v1, ≤ 365 days old). Reads only. -->
    <script>
      (function () {
        try {
          var m = /(?:^|;\s*)cookie_consent=v1\.a[01]\.(\d{10,14})(?:;|$)/.exec(document.cookie);
          var age = m ? Date.now() - Number(m[1]) : -1;
          if (m && age > -86400000 && age < 31536000000) document.documentElement.setAttribute('data-consent-known', '');
        } catch (e) {}
      })();
    </script>

    <!-- Critical CSS inline (estilos mínimos para above-the-fold, respetan tema) -->
    <style>
      /* Critical CSS - Evita FOUC */
      body {
        margin: 0;
        font-family: 'Inter', system-ui, -apple-system, Segoe UI, sans-serif;
        background: #fdfdfd;
        min-height: 100vh;
        color: #121212;
      }
      html[data-theme='dark'] body {
        background: #121212;
        color: #ffffff;
      }
      app-root {
        display: block;
        min-height: 100vh;
      }
      /* Placeholder mientras carga la app */
      app-root:empty::before {
        content: '';
        display: block;
        width: 100%;
        height: 100vh;
        background: #fdfdfd;
      }
      html[data-theme='dark'] app-root:empty::before {
        background: #121212;
      }
    </style>
  </head>
  <body>
    <app-root></app-root>

    <!-- Prefetch de rutas probables después de carga inicial -->
    <script>
      // Prefetch de recursos después de que la página esté idle
      if ('requestIdleCallback' in window) {
        requestIdleCallback(function() {
          // Prefetch de iconos de canales populares
          var popularChannels = ['la_1', 'la_2', 'antena_3', 'cuatro', 'telecinco'];
          popularChannels.forEach(function(channel) {
            var link = document.createElement('link');
            link.rel = 'prefetch';
            link.href = '/storage/channel_icons/' + channel + '.webp';
            link.as = 'image';
            document.head.appendChild(link);
          });
        });
      }
    </script>
  </body>
</html>
