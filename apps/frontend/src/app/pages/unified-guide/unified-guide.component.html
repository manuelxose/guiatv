<app-unified-portal-shell
  class="unified-guide-page"
  [tone]="activeTab()"
  [breadcrumbItems]="[]"
  [showHero]="false"
>
  <app-portal-context-nav
    [kind]="contextNavKind()"
    [active]="activeTab() === 'streaming' ? null : sectionSelection()"
    [actionLabel]="platformMode() === 'compare' ? null : 'Más filtros'"
    [actionCount]="filterCount()"
    (itemSelect)="onSectionSelect($event)"
    (action)="toggleFilterDock()"
  ></app-portal-context-nav>
  <section id="tab-panel-discover" role="tabpanel" *ngIf="activeTab() === 'discover'">
    <app-discover-view></app-discover-view>
  </section>
  <section id="tab-panel-streaming" role="tabpanel" *ngIf="activeTab() === 'streaming'">
    <app-streaming-view *ngIf="platformMode() === 'catalog'"></app-streaming-view>
    <app-streaming-comparison *ngIf="platformMode() === 'compare'"></app-streaming-comparison>
  </section>
</app-unified-portal-shell>
