<app-auth-layout heading="Crea tu cuenta" lead="Gratis y en un minuto. El asistente aprende tus plataformas y gustos para recomendarte qué ver.">
  @if (isAuthenticated$ | async) {
  <span class="af__active">Ya tienes la sesión iniciada</span>
  }

  <form class="af" (ngSubmit)="onPasswordRegister()">
    <div class="af__field">
      <label for="register-name">Nombre (opcional)</label>
      <input id="register-name" name="name" type="text" autocomplete="name" [(ngModel)]="registerData.name" placeholder="Tu nombre" />
    </div>
    <div class="af__field">
      <label for="register-email">Email</label>
      <input id="register-email" name="email" type="email" required autocomplete="email" [(ngModel)]="registerData.email" placeholder="tu@email.com" />
    </div>
    <div class="af__field">
      <label for="register-password">Contraseña</label>
      <input id="register-password" name="password" type="password" required autocomplete="new-password" [(ngModel)]="registerData.password" placeholder="Mínimo 8 caracteres" />
    </div>
    <div class="af__field">
      <label for="register-confirm">Repite la contraseña</label>
      <input id="register-confirm" name="confirmPassword" type="password" required autocomplete="new-password" [(ngModel)]="registerData.confirmPassword" placeholder="Repite la contraseña" />
    </div>
    <button type="submit" class="af__submit" [disabled]="loading">{{ loading ? 'Creando…' : 'Crear cuenta' }}</button>
  </form>

  <div class="af__divider">o</div>

  <button type="button" class="af__google" (click)="onGoogleRegister()" [disabled]="loading">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" aria-hidden="true">
      <path fill="#EA4335" d="M24 9.5c3.54 0 6 1.54 7.38 2.83l5.4-5.4C33.64 3.91 29.14 2 24 2 14.82 2 6.91 7.66 3.44 15.26l6.58 5.11C12.23 13.2 17.59 9.5 24 9.5z" />
      <path fill="#4285F4" d="M46.5 24.5c0-1.6-.14-3.11-.4-4.5H24v9h12.7c-.5 2.6-2 4.8-4.3 6.3l6.6 5.1C43.9 37.5 46.5 31.5 46.5 24.5z" />
      <path fill="#FBBC05" d="M9.02 28.65a14.9 14.9 0 0 1 0-9.3L2.44 14.2a22.46 22.46 0 0 0 0 19.6l6.58-5.15z" />
      <path fill="#34A853" d="M24 46c6.14 0 11.3-2.02 15.07-5.4l-6.6-5.1C30.39 36.5 27.39 37.5 24 37.5c-6.41 0-11.77-3.7-13.98-9.1l-6.58 5.1C6.91 40.34 14.82 46 24 46z" />
    </svg>
    <span>{{ loading ? 'Conectando…' : 'Crear cuenta con Google' }}</span>
  </button>

  @if (statusMessage) {
  <p class="af__status" [class.af__status--success]="statusTone === 'success'" [class.af__status--error]="statusTone === 'error'" role="status">{{ statusMessage }}</p>
  }

  <p class="af__switch">¿Ya tienes cuenta? <a routerLink="/iniciar-sesion">Inicia sesión</a></p>
  <p class="af__legal">Al crear la cuenta aceptas los <a routerLink="/terminos">términos</a> y la <a routerLink="/privacidad">política de privacidad</a>.</p>
</app-auth-layout>
