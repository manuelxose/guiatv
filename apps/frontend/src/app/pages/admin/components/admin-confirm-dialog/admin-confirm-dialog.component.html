<div
  *ngIf="open"
  class="admin-confirm-dialog__backdrop"
  role="presentation"
>
  <button
    type="button"
    class="admin-confirm-dialog__backdrop-close"
    aria-label="Close dialog"
    (click)="onCancel()"
  ></button>

  <div
    #panel
    class="admin-confirm-dialog__panel"
    role="alertdialog"
    aria-modal="true"
    [attr.aria-labelledby]="'admin-confirm-title'"
    [attr.aria-describedby]="description ? 'admin-confirm-desc' : null"
    tabindex="-1"
  >
    <h2 id="admin-confirm-title" class="text-base font-semibold text-[var(--portal-text)]">{{ title }}</h2>
    <p *ngIf="description" id="admin-confirm-desc" class="mt-2 text-sm text-[var(--portal-text-soft)]">
      {{ description }}
    </p>
    <div class="mt-5 flex items-center justify-end gap-3">
      <button
        type="button"
        class="px-3 py-2 rounded-[var(--radius-sm)] border border-[var(--portal-border-strong)] text-xs text-[var(--portal-text-soft)] hover:text-[var(--portal-text)] focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[var(--spotify-green)]"
        [disabled]="busy"
        (click)="onCancel()"
      >
        {{ cancelLabel }}
      </button>
      <button
        type="button"
        class="px-3 py-2 rounded-[var(--radius-sm)] text-xs font-medium focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[var(--spotify-green)]"
        [ngClass]="danger
          ? 'bg-[var(--spotify-negative)]/20 border border-[var(--spotify-negative)]/40 text-[var(--spotify-negative-text)] hover:bg-[var(--spotify-negative)]/30'
          : 'bg-[var(--portal-surface-strong)] border border-[var(--portal-border-strong)] text-[var(--portal-text)]'"
        [disabled]="busy"
        (click)="onConfirm()"
      >
        {{ busy ? 'Working…' : confirmLabel }}
      </button>
    </div>
  </div>
</div>
