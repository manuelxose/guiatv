<header class="sticky top-0 z-20 border-b border-[var(--portal-border)] bg-[var(--portal-surface)] backdrop-blur-xl">
  <div class="px-5 sm:px-6 lg:px-8 py-4">
    <div class="flex flex-wrap items-center justify-between gap-4">
      <div class="flex items-start gap-3 min-w-0">
        <button
          data-admin-sidebar-trigger
          class="lg:hidden h-10 w-10 shrink-0 rounded-[var(--radius-sm)] bg-[var(--portal-surface)] border border-[var(--portal-border)] text-[var(--portal-text)] flex items-center justify-center focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[var(--spotify-green)]"
          (click)="onToggleSidebar()"
          type="button"
          aria-label="Open navigation"
          aria-controls="admin-sidebar"
          [attr.aria-expanded]="mobileSidebarOpen"
        >
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" class="h-5 w-5" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16" />
          </svg>
        </button>
        <div class="space-y-1 min-w-0">
          <nav class="flex items-center gap-2 text-xs text-[var(--portal-text-muted)]" aria-label="Breadcrumb">
            <span>GuíaTV Admin</span>
            <span aria-hidden="true">/</span>
            <span>{{ activeGroupLabel }}</span>
            <span aria-hidden="true">/</span>
            <span class="text-[var(--portal-text)]">{{ activeItemLabel }}</span>
          </nav>
          <h2 class="text-lg font-semibold text-[var(--portal-text)] truncate">{{ activeItemLabel }}</h2>
          <p *ngIf="activeItemDescription" class="text-xs text-[var(--portal-text-soft)]">
            {{ activeItemDescription }}
          </p>
        </div>
      </div>

      <div class="flex flex-wrap items-center gap-3">
        <span
          class="text-[10px] px-2 py-1 rounded-[var(--radius-sm)] border shrink-0"
          [ngClass]="environmentLabel === 'Production' ? 'border-[var(--spotify-negative)]/40 text-[var(--spotify-negative-text)] bg-[var(--spotify-negative)]/10' : 'border-[var(--accent-discover)]/40 text-[var(--accent-discover-text)] bg-[var(--accent-discover)]/10'"
        >
          {{ environmentLabel }}
        </span>

        <div *ngIf="lastUpdated" class="text-xs text-[var(--portal-text-muted)] whitespace-nowrap">
          Updated {{ lastUpdated | date: 'shortTime' }}
        </div>

        <div *ngIf="adminProfile?.email as email" class="hidden sm:flex items-center gap-2 text-xs text-[var(--portal-text-soft)] border border-[var(--portal-border)] rounded-full px-3 py-1.5">
          <span class="h-1.5 w-1.5 rounded-full bg-[var(--spotify-negative)]" aria-hidden="true"></span>
          <span class="truncate max-w-[16ch]" [attr.title]="email">{{ adminProfile?.name || email }}</span>
        </div>

        <a
          [routerLink]="['/']"
          class="px-3 py-2 rounded-[var(--radius-sm)] border border-[var(--portal-border-strong)] text-xs text-[var(--portal-text-soft)] hover:text-[var(--portal-text)] hover:border-[var(--portal-border-strong)] focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[var(--spotify-green)] whitespace-nowrap"
        >
          Back to GuíaTV
        </a>
      </div>
    </div>
  </div>
</header>
