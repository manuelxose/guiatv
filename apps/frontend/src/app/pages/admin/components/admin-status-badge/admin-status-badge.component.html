<span
  class="inline-flex items-center gap-1.5 rounded-[var(--radius-sm)] border px-2.5 py-1 text-[11px] font-medium"
  [ngClass]="toneClasses"
>
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" class="h-3 w-3 shrink-0" aria-hidden="true">
    <path
      *ngIf="tone === 'positive'"
      stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"
    />
    <path
      *ngIf="tone === 'warning' || tone === 'critical'"
      stroke-linecap="round" stroke-linejoin="round" d="M12 9v4 M12 17h.01 M10.3 4.5 2.6 18a1.5 1.5 0 0 0 1.3 2.2h16.2a1.5 1.5 0 0 0 1.3-2.2L13.7 4.5a1.5 1.5 0 0 0-2.6 0Z"
    />
    <circle *ngIf="tone === 'neutral'" cx="12" cy="12" r="6" fill="currentColor" stroke="none" />
    <path
      *ngIf="tone === 'unknown'"
      stroke-linecap="round" stroke-linejoin="round" d="M9.5 9a2.5 2.5 0 1 1 3.5 2.3c-.9.4-1.5 1.1-1.5 2.2v.5 M12 17h.01"
    />
  </svg>
  {{ displayLabel }}
</span>
