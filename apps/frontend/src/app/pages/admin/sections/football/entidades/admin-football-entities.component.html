<div class="space-y-6">
  <div *ngIf="error" class="rounded-xl border border-[var(--spotify-negative)]/40 bg-[var(--spotify-negative)]/10 p-4 text-sm text-[var(--spotify-negative)]">
    {{ error }}
  </div>

  <p *ngIf="loading && !entities.length" class="text-sm text-[var(--portal-text-muted)]">Cargando entidades…</p>

  <ng-container *ngIf="entities.length">
    <div class="flex flex-wrap items-center gap-2">
      <button type="button" class="px-3 py-2 text-xs rounded-xl border border-[var(--portal-border)]" (click)="setFilter('all')">Todas</button>
      <button type="button" class="px-3 py-2 text-xs rounded-xl border border-[var(--portal-border)]" (click)="setFilter('competition')">Competiciones</button>
      <button type="button" class="px-3 py-2 text-xs rounded-xl border border-[var(--portal-border)]" (click)="setFilter('team')">Equipos</button>
    </div>

    <div class="bg-[var(--portal-surface)] border border-[var(--portal-border)] rounded-2xl overflow-x-auto">
      <table class="w-full text-sm">
        <thead class="text-left text-[var(--portal-text-muted)]">
          <tr>
            <th class="p-4">Nombre</th>
            <th>Tipo</th>
            <th>Mapeo</th>
            <th>Estado</th>
            <th>Actualizado</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let entity of filtered" class="border-t border-[var(--portal-border)]">
            <td class="p-4 text-[var(--portal-text)]">{{ entity.name }}</td>
            <td class="text-[var(--portal-text-soft)]">{{ entity.kind === 'competition' ? 'Competición' : 'Equipo' }}</td>
            <td>
              <app-admin-status-badge
                [status]="entity.mapped ? 'configured' : 'missing'"
                [label]="entity.mapped ? 'Mapeado' : 'Sin mapear'"
              ></app-admin-status-badge>
            </td>
            <td>
              <app-admin-status-badge
                [status]="entity.stale ? 'stale' : 'current'"
                [label]="entity.stale ? 'Desactualizado' : 'Al día'"
              ></app-admin-status-badge>
            </td>
            <td class="text-[var(--portal-text-soft)]">{{ entity.lastUpdatedAt ? (entity.lastUpdatedAt | date:'short') : 'Nunca' }}</td>
          </tr>
        </tbody>
      </table>
    </div>
  </ng-container>

  <p *ngIf="!loading && !entities.length && !error" class="text-sm text-[var(--portal-text-muted)]">
    No hay entidades registradas.
  </p>
</div>
