<div
  class="admin-shell min-h-screen bg-[var(--portal-bg)] text-[var(--portal-text)]"
  [class.admin-shell--collapsed]="desktopSidebarCollapsed"
>
  <app-admin-sidebar
    [navGroups]="navGroups"
    [activeGroup]="activeGroup"
    [activeItem]="activeItem"
    [mobileOpen]="mobileSidebarOpen"
    [desktopCollapsed]="desktopSidebarCollapsed"
    [environmentLabel]="environmentLabel"
    (sectionSelected)="selectSection($event.group, $event.item)"
    (closeMobile)="closeMobileSidebar()"
    (toggleDesktopCollapsed)="toggleDesktopSidebarCollapsed()"
  ></app-admin-sidebar>

  <button
    *ngIf="mobileSidebarOpen"
    type="button"
    class="admin-shell__backdrop"
    aria-label="Close navigation"
    (click)="closeMobileSidebar()"
  ></button>

  <div class="admin-shell__content flex flex-col min-h-screen min-w-0">
    <app-admin-header
      [activeGroupLabel]="activeGroupLabel"
      [activeItemLabel]="activeItemLabel"
      [activeItemDescription]="activeItemDescription"
      [lastUpdated]="lastUpdated"
      [mobileSidebarOpen]="mobileSidebarOpen"
      [adminProfile]="adminProfile | async"
      [environmentLabel]="environmentLabel"
      (toggleSidebar)="toggleMobileSidebar()"
    ></app-admin-header>

    <main class="flex-1 px-5 sm:px-6 lg:px-10 py-6 lg:py-8 min-w-0">
      <div class="mx-auto w-full max-w-[1600px] space-y-10">
          <app-admin-overview-section
            *ngIf="activeGroup === 'overview'"
            (navigate)="navigateTo($event)"
            (lastUpdatedChange)="onLastUpdated($event)"
          ></app-admin-overview-section>

          <app-admin-analytics-section
            *ngIf="activeGroup === 'analytics'"
            [activeItem]="activeItem"
            (activeItemChange)="selectSection('analytics', $event)"
            (lastUpdatedChange)="onLastUpdated($event)"
          ></app-admin-analytics-section>

          <ng-container *ngIf="activeGroup === 'content'">
            <app-admin-blog-section
              *ngIf="activeItem === 'blog'"
              (lastUpdatedChange)="onLastUpdated($event)"
            ></app-admin-blog-section>
            <app-admin-content-section
              *ngIf="activeItem !== 'blog'"
              [activeItem]="activeItem"
              (lastUpdatedChange)="onLastUpdated($event)"
            ></app-admin-content-section>
          </ng-container>

          <app-admin-affiliate-section
            *ngIf="activeGroup === 'monetization'"
            [activeItem]="activeItem"
            (activeItemChange)="selectSection('monetization', $event)"
            (lastUpdatedChange)="onLastUpdated($event)"
          ></app-admin-affiliate-section>
          <app-admin-schedules-section
            *ngIf="activeGroup === 'schedules'"
            (lastUpdatedChange)="onLastUpdated($event)"
          ></app-admin-schedules-section>
          <app-admin-operations-section
            *ngIf="activeGroup === 'operations'"
            [activeItem]="activeItem"
            (lastUpdatedChange)="onLastUpdated($event)"
          ></app-admin-operations-section>
          <ng-container *ngIf="activeGroup === 'users'">
            <app-admin-users-section
              *ngIf="activeItem !== 'moderation'"
              [activeItem]="activeItem"
              (lastUpdatedChange)="onLastUpdated($event)"
            ></app-admin-users-section>
            <app-admin-community-section
              *ngIf="activeItem === 'moderation'"
              (lastUpdatedChange)="onLastUpdated($event)"
            ></app-admin-community-section>
          </ng-container>
          <app-admin-system-section
            *ngIf="activeGroup === 'system'"
            (lastUpdatedChange)="onLastUpdated($event)"
          ></app-admin-system-section>
          <ng-container *ngIf="activeGroup === 'ai'">
            <app-admin-ai-section
              *ngIf="activeItem !== 'editorial' && activeItem !== 'rejected'"
              (lastUpdatedChange)="onLastUpdated($event)"
            ></app-admin-ai-section>
            <app-admin-editorial-section
              *ngIf="activeItem === 'editorial'"
              [initialTab]="editorialInitialTab"
              (lastUpdatedChange)="onLastUpdated($event)"
            ></app-admin-editorial-section>
            <app-admin-rejected-inbox
              *ngIf="activeItem === 'rejected'"
              (lastUpdatedChange)="onLastUpdated($event)"
            ></app-admin-rejected-inbox>
          </ng-container>

          <!--
            Flujo C (m14r-c) entrega sections/seo/** con el componente standalone AdminSeoSectionComponent.
            En m14r-b ese directorio todavía NO existe, por lo que un import real rompería el build: se mantiene
            este placeholder. Pasos exactos para el montaje cuando C esté fusionado en esta rama:
              1) import { AdminSeoSectionComponent } from './sections/seo/admin-seo-section.component';
              2) añadir AdminSeoSectionComponent a `imports` del @Component de AdminComponent;
              3) sustituir este <section> por el selector que declare C (previsto app-admin-seo-section):
                 <app-admin-seo-section *ngIf="activeGroup === 'seo'" (lastUpdatedChange)="onLastUpdated($event)"></app-admin-seo-section>
            La entrada de navegación 'seo' y el AdminGroupId 'seo' ya están creados y no hay que tocarlos.
          -->
          <section *ngIf="activeGroup === 'seo'" aria-labelledby="seo-placeholder-heading" class="rounded-2xl border border-[var(--portal-border)] bg-[var(--portal-surface)] p-6">
            <p class="text-[10px] uppercase tracking-[0.3em] text-[var(--portal-text-muted)]">SEO</p>
            <h3 id="seo-placeholder-heading" class="text-2xl font-semibold text-[var(--portal-text)] mt-1">Centro de control SEO</h3>
            <p class="text-sm text-[var(--portal-text-soft)] mt-2">La sección de indexación y remediación llega desde el flujo C (<code>sections/seo/**</code>) y aún no está montada. Los datos de Search Console se consultan desde AI Assistant → Operaciones IA → Search Console.</p>
          </section>

        </div>
      </main>
    </div>
  </div>
