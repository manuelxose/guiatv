<div
  class="admin-shell min-h-screen bg-[var(--portal-bg)] text-[var(--portal-text)]"
  [class.admin-shell--collapsed]="desktopSidebarCollapsed"
>
  <app-admin-sidebar
    [navGroups]="navGroups"
    [activeGroup]="activeGroup"
    [activeItem]="activeItem"
    [mobileOpen]="mobileSidebarOpen"
    [desktopCollapsed]="desktopSidebarCollapsed"
    [environmentLabel]="environmentLabel"
    (sectionSelected)="selectSection($event.group, $event.item)"
    (closeMobile)="closeMobileSidebar()"
    (toggleDesktopCollapsed)="toggleDesktopSidebarCollapsed()"
  ></app-admin-sidebar>

  <button
    *ngIf="mobileSidebarOpen"
    type="button"
    class="admin-shell__backdrop"
    aria-label="Close navigation"
    (click)="closeMobileSidebar()"
  ></button>

  <div class="admin-shell__content flex flex-col min-h-screen min-w-0">
    <app-admin-header
      [activeGroupLabel]="activeGroupLabel"
      [activeItemLabel]="activeItemLabel"
      [activeItemDescription]="activeItemDescription"
      [lastUpdated]="lastUpdated"
      [mobileSidebarOpen]="mobileSidebarOpen"
      [adminProfile]="adminProfile | async"
      [environmentLabel]="environmentLabel"
      (toggleSidebar)="toggleMobileSidebar()"
    ></app-admin-header>

    <main class="flex-1 px-5 sm:px-6 lg:px-10 py-6 lg:py-8 min-w-0">
      <div class="mx-auto w-full max-w-[1600px] space-y-10">
          <app-admin-overview-section
            *ngIf="activeGroup === 'overview'"
            (navigate)="selectSection($event.group, $event.item)"
            (lastUpdatedChange)="onLastUpdated($event)"
          ></app-admin-overview-section>

          <app-admin-analytics-section
            *ngIf="activeGroup === 'analytics'"
            [activeItem]="activeItem"
            (activeItemChange)="selectSection('analytics', $event)"
            (lastUpdatedChange)="onLastUpdated($event)"
          ></app-admin-analytics-section>

          <ng-container *ngIf="activeGroup === 'content'">
            <app-admin-blog-section
              *ngIf="activeItem === 'blog'"
              (lastUpdatedChange)="onLastUpdated($event)"
            ></app-admin-blog-section>
            <app-admin-content-section
              *ngIf="activeItem !== 'blog'"
              [activeItem]="activeItem"
              (lastUpdatedChange)="onLastUpdated($event)"
            ></app-admin-content-section>
          </ng-container>

          <app-admin-affiliate-section
            *ngIf="activeGroup === 'monetization'"
            [activeItem]="activeItem"
            (activeItemChange)="selectSection('monetization', $event)"
            (lastUpdatedChange)="onLastUpdated($event)"
          ></app-admin-affiliate-section>
          <app-admin-schedules-section
            *ngIf="activeGroup === 'schedules'"
            (lastUpdatedChange)="onLastUpdated($event)"
          ></app-admin-schedules-section>
          <app-admin-operations-section
            *ngIf="activeGroup === 'operations'"
            [activeItem]="activeItem"
            (lastUpdatedChange)="onLastUpdated($event)"
          ></app-admin-operations-section>
          <ng-container *ngIf="activeGroup === 'users'">
            <app-admin-users-section
              *ngIf="activeItem !== 'moderation'"
              [activeItem]="activeItem"
              (lastUpdatedChange)="onLastUpdated($event)"
            ></app-admin-users-section>
            <app-admin-community-section
              *ngIf="activeItem === 'moderation'"
              (lastUpdatedChange)="onLastUpdated($event)"
            ></app-admin-community-section>
          </ng-container>
          <app-admin-system-section
            *ngIf="activeGroup === 'system'"
            (lastUpdatedChange)="onLastUpdated($event)"
          ></app-admin-system-section>
          <ng-container *ngIf="activeGroup === 'ai'">
            <app-admin-ai-section
              *ngIf="activeItem !== 'editorial'"
              (lastUpdatedChange)="onLastUpdated($event)"
            ></app-admin-ai-section>
            <app-admin-editorial-section
              *ngIf="activeItem === 'editorial'"
              (lastUpdatedChange)="onLastUpdated($event)"
            ></app-admin-editorial-section>
          </ng-container>

        </div>
      </main>
    </div>
  </div>
