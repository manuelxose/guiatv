<span class="platform-badge" [ngClass]="toneClass">
  @if (hasLogo) {
  <img [src]="resolvedLogoUrl" [alt]="''" width="24" height="24" loading="lazy" aria-hidden="true" (error)="onLogoError()" />
  } @else {
  <span class="platform-badge__mark" aria-hidden="true">{{ initials }}</span>
  }
  <span>{{ label }}</span>
</span>
