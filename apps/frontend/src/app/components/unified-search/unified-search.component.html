<div class="search-shell" (click)="onShellClick($event)" (keydown)="handleKeyboard($event)" tabindex="-1">
  <label class="sr-only" for="unified-search-input">Buscar contenido</label>

  <div class="search-shell__field" [class.search-shell__field--expanded]="expanded">
    <span class="search-shell__leading-icon" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
        <circle cx="11" cy="11" r="6.5" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"></circle>
        <path d="M16 16l4.5 4.5" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"></path>
      </svg>
    </span>

    <input
      #searchInput
      id="unified-search-input"
      type="text"
      name="q"
      inputmode="search"
      enterkeyhint="search"
      [formControl]="control"
      [placeholder]="placeholder"
      autocomplete="off"
      role="combobox"
      aria-autocomplete="list"
      [attr.aria-controls]="showMenu ? 'unified-search-results' : null"
      [attr.aria-expanded]="showMenu"
      [attr.aria-activedescendant]="activeDescendantId"
      (focus)="onFocus()"
    />

    <button *ngIf="control.value" type="button" class="search-shell__clear" (click)="clear()" aria-label="Limpiar búsqueda">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true">
        <path d="M6 6 18 18M18 6 6 18" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"></path>
      </svg>
    </button>

  </div>

  <div *ngIf="showMenu" class="search-shell__menu">
    <div class="search-shell__menu-head">
      <p>{{ control.value ? 'Sugerencias' : 'Búsqueda rápida' }}</p>
      <span *ngIf="control.value && !isLoading" aria-live="polite">{{ suggestions.length }} resultados</span>
      <span *ngIf="isLoading" class="search-shell__loading-text">Buscando…</span>
    </div>

    <p *ngIf="!isLoading && control.value.trim() && !suggestions.length" class="search-shell__empty" role="status">No hay sugerencias. Prueba con otro título o consulta los resultados completos.</p>
    <p *ngIf="!isLoading && !control.value.trim() && !history.length" class="search-shell__empty">Busca programas, películas, series o fútbol.</p>
    <div id="unified-search-results" role="listbox" aria-label="Sugerencias de búsqueda" [attr.aria-busy]="isLoading">
      <div
        *ngFor="let group of suggestionGroups"
        class="search-shell__group"
        role="group"
        [attr.aria-label]="group.label"
      >
      <p class="search-shell__group-heading" [attr.data-accent]="group.accent">
        <span class="search-shell__group-dot" aria-hidden="true"></span>
        {{ group.label }}
      </p>

      <button
        *ngFor="let entry of group.items"
        type="button"
        role="option"
        tabindex="-1"
        [id]="'unified-search-option-' + entry.index"
        [attr.aria-selected]="focusedIndex === entry.index"
        class="search-shell__option"
        [class.search-shell__option--focused]="focusedIndex === entry.index"
        (click)="openSuggestion(entry.item)"
      >
        <span class="search-shell__option-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
            <path d="M8.25 7.5 16.5 12l-8.25 4.5v-9Z" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"></path>
          </svg>
        </span>
        <span class="search-shell__option-copy">
          <span class="search-shell__option-title">{{ entry.item.title }}</span>
          <span class="search-shell__option-meta">
            {{ entry.item.meta }}
          </span>
        </span>
      </button>
      </div>

      <button
        *ngFor="let entry of !control.value.trim() ? history : []; let i = index"
        type="button"
        role="option"
        tabindex="-1"
        [id]="'unified-search-option-' + i"
        [attr.aria-selected]="focusedIndex === i"
        class="search-shell__option search-shell__option--history"
        [class.search-shell__option--focused]="focusedIndex === i"
        (click)="useHistory(entry)"
      >
        <span class="search-shell__option-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
            <path d="M12 6v6l4.5 2.25M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"></path>
          </svg>
        </span>
        <span class="search-shell__option-copy">
          <span class="search-shell__option-title">{{ entry }}</span>
          <span class="search-shell__option-meta">Historial</span>
        </span>
      </button>
    </div>

    <button *ngIf="control.value" type="button" class="search-shell__submit" (click)="submit()">
      Ver resultados completos
    </button>
  </div>
</div>
