<article
  class="program-card"
  [class.program-card--compact]="variant === 'compact'"
  [class.program-card--epg]="variant === 'epg-row'"
  [class.program-card--sport]="variant === 'sport'"
  [class.program-card--live]="variant === 'live'"
  [class.program-card--feature]="variant === 'feature'"
  [class.program-card--boxed]="variant !== 'epg-row'"
  [attr.data-vertical]="variant === 'epg-row' ? null : card.vertical"
>
  <a
    [routerLink]="card.detailPath || null"
    [appPrefetchDetail]="card"
    class="program-card__tap"
    [attr.aria-label]="card.detailPath ? actionLabel + ': ' + card.title : null"
  >
    <div class="program-card__media" [class.program-card__media--empty]="!hasVisual">
      <img
        *ngIf="hasVisual"
        [src]="imageUrl"
        [alt]="card.title"
        width="640"
        height="360"
        [loading]="variant === 'live' || variant === 'feature' ? 'eager' : 'lazy'"
        [attr.fetchpriority]="variant === 'live' || variant === 'feature' ? 'high' : 'auto'"
        [attr.decoding]="variant === 'live' || variant === 'feature' ? 'sync' : 'async'"
        (error)="useFallbackImage($event)"
      />
      <div class="program-card__gradient"></div>
      <div class="program-card__badges">
        <span *ngFor="let badge of card.badges.slice(0, 3)" class="program-card__badge">
          {{ badge }}
        </span>
      </div>
      <div *ngIf="card.liveNow" class="program-card__progress">
        <span class="program-card__progress-fill" [ngClass]="progressClass"></span>
      </div>
    </div>

    <div class="program-card__body">
      <div class="program-card__eyebrow" *ngIf="showChannel && (card.channelName || card.startTime || card.category)">
        <span class="program-card__channel" *ngIf="card.channelName">
          <img *ngIf="card.channelIcon" [src]="card.channelIcon" [alt]="''" width="48" height="48" loading="lazy" aria-hidden="true" (error)="hideBrokenImage($event)" />
          <span>{{ card.channelName }}</span>
        </span>
        <span *ngIf="card.channelName && (timeLabel || card.category)" aria-hidden="true">·</span>
        <span *ngIf="timeLabel">{{ timeLabel }}</span>
        <span *ngIf="timeLabel && card.category" aria-hidden="true">·</span>
        <span *ngIf="card.category">{{ card.category }}</span>
      </div>
      <h3 class="program-card__title">{{ card.title }}</h3>
      <p *ngIf="card.description" class="program-card__description">{{ card.description }}</p>

      <div class="program-card__meta-strip" *ngIf="card.liveNow || card.sport || card.subtitle">
        <span class="program-card__meta-pill program-card__meta-pill--live" *ngIf="card.liveNow">
          <i aria-hidden="true"></i>
          En directo
        </span>
        <span class="program-card__meta-pill" *ngIf="card.sport">{{ card.sport }}</span>
        <span class="program-card__meta-pill" *ngIf="!card.sport && card.subtitle">{{ card.subtitle }}</span>
      </div>

      <div class="program-card__meta" *ngIf="card.platforms.length">
        <app-platform-badge
          *ngFor="let platform of card.platforms.slice(0, 3)"
          [label]="platform"
        ></app-platform-badge>
      </div>
    </div>
  </a>

  <div class="program-card__interactive" *ngIf="showActions && (isAuthenticated() || affiliateOffer())">
    <div class="program-card__actions">
      <button
        *ngIf="isAuthenticated()"
        type="button"
        class="program-card__quick-action"
        [class.program-card__quick-action--active]="isSaved"
        [attr.aria-label]="isSaved ? 'Quitar de guardados' : 'Guardar'"
        [attr.aria-pressed]="isSaved"
        (click)="toggleWatchlist($event)"
      >
        <svg viewBox="0 0 20 20" aria-hidden="true" [attr.fill]="isSaved ? 'currentColor' : 'none'" stroke="currentColor" stroke-width="1.6">
          <path d="M5 3.5h10a1 1 0 011 1V17l-6-3.4-6 3.4V4.5a1 1 0 011-1z" stroke-linejoin="round" />
        </svg>
      </button>

      <app-affiliate-cta
        *ngIf="affiliateOffer() as offer"
        class="program-card__affiliate-cta"
        [offer]="offer"
        variant="secondary"
        [appAffiliateImpression]="offer"
        [appAffiliateImpressionContext]="affiliateImpressionContext()"
      ></app-affiliate-cta>
    </div>
  </div>
</article>
