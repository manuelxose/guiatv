<header class="utn" [class.utn--fixed]="fixed()">
  <ng-content select="[utnLead]"></ng-content>

  @if (showLeftRail()) {
  <button type="button" class="utn__ib" (click)="leftRailToggle.emit()" aria-label="Abrir navegación lateral">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true"><path [attr.d]="iconPaths.menu" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"></path></svg>
  </button>
  }

  <a [routerLink]="homePath" class="utn__brand" [attr.aria-label]="'Guía TV' + (brandSuffix() ? ' ' + brandSuffix() : '') + ', inicio'">
    <span class="utn__mark" aria-hidden="true">
      <svg viewBox="0 0 32 32" fill="none">
        <rect class="logo-bg" width="32" height="32" rx="10"></rect>
        <rect class="logo-screen" x="5" y="8" width="22" height="13" rx="3"></rect>
        <path d="M14 12v6.5c0 .5.55.8.96.53l5.4-3.25a.62.62 0 0 0 0-1.06l-5.4-3.25A.62.62 0 0 0 14 12Z" class="logo-play"></path>
      </svg>
    </span>
    <span class="utn__word">GuíaTV @if (brandSuffix()) {<b>{{ brandSuffix() }}</b>}</span>
  </a>

  <div class="utn__sections" (focusout)="sectionsFocusOut($event)" (keydown.escape)="sectionsOpen.set(false)">
    <button type="button" class="utn__more" [attr.aria-expanded]="sectionsOpen()" aria-controls="utn-sections" aria-label="Secciones de Guía TV" (click)="sectionsOpen.set(!sectionsOpen())">
      <span class="utn__more-lbl">Secciones</span>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true"><path d="M6 9l6 6 6-6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /></svg>
    </button>
    <nav id="utn-sections" aria-label="Secciones de Guía TV" [class.open]="sectionsOpen()">
      @for (tab of tabs; track tab.id) {
      <a [routerLink]="tab.path" [class.on]="activeTab() === tab.id" [attr.aria-current]="activeTab() === tab.id ? 'page' : null" (click)="sectionsOpen.set(false)">{{ tab.label }}</a>
      }
      <button type="button" class="utn__theme-row" (click)="theme.toggle()">{{ themeLabel }}</button>
    </nav>
  </div>

  <div class="utn__search">
    <ng-content select="[utnSearch]">
      <app-unified-search
        [query]="searchQuery()"
        [expanded]="true"
        (searchChange)="searchQuery.set($event)"
        (searchSubmit)="onSearchSubmit($event)"
      ></app-unified-search>
    </ng-content>
  </div>

  <div class="utn__actions">
    @if (showAssistant()) {
    <button type="button" class="utn__assistant" (click)="openAssistant()" aria-label="Abrir el asistente de recomendaciones">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true"><path d="M12 3 13.8 8.2 19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8L12 3Z" stroke-width="1.8" stroke-linejoin="round"></path></svg>
      <span>Asistente</span>
    </button>
    }
    <ng-content select="[utnActions]"></ng-content>

    <button type="button" class="utn__ib utn__theme" (click)="theme.toggle()" [attr.aria-label]="themeLabel" [attr.title]="themeLabel">
      @if (theme.resolved === 'light') {
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3a7 7 0 0 0 9.79 9.79Z" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"></path></svg>
      } @else {
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true"><circle cx="12" cy="12" r="4.2" stroke-width="1.8"></circle><path d="M12 2.5v2M12 19.5v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2.5 12h2M19.5 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41" stroke-linecap="round" stroke-width="1.8"></path></svg>
      }
    </button>

    @if (isAuthenticated()) {
    <app-notification-bell></app-notification-bell>
    } @else {
    <a class="utn__ib" [routerLink]="loginPath" aria-label="Notificaciones: inicia sesión para recibir avisos" title="Notificaciones">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9M13.73 21a2 2 0 0 1-3.46 0" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"></path></svg>
    </a>
    }

    <a class="utn__ib" [routerLink]="isAuthenticated() ? profilePath : loginPath" [attr.aria-label]="isAuthenticated() ? 'Mi cuenta: ' + profileName() : 'Acceder a mi cuenta'" [attr.title]="isAuthenticated() ? profileName() : 'Acceder'">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true"><path [attr.d]="iconPaths.account" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"></path></svg>
    </a>

    @if (showRightRail()) {
    <button type="button" class="utn__ib" (click)="rightRailToggle.emit()" [attr.aria-label]="rightRailLabel()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true"><path [attr.d]="iconPaths.panel" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"></path></svg>
    </button>
    }
  </div>
</header>
